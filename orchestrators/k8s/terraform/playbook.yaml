---
- name: Bootstrap Local Kubernetes Environment
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    minikube_cpus: "{{ lookup('env', 'MINIKUBE_CPUS') | default('4', true) }}"
    minikube_memory: "{{ lookup('env', 'MINIKUBE_MEMORY') | default('7800mb', true) }}"
    deploy_environment: "{{ lookup('env', 'TF_VAR_environment') | default('local', true) }}"
    ingress_host: "{{ 'dev.kino.com' if deploy_environment == 'dev' else 'local.kino.com' }}"
    terraform_dir: "{{ playbook_dir }}"

  tasks:
    - name: Check for required tools
      ansible.builtin.command: "which {{ item }}"
      loop:
        - kubectl
        - helm
        - minikube
        - terraform
      register: tool_check
      failed_when: tool_check.rc != 0
      changed_when: false

    - name: Check Minikube status
      ansible.builtin.command: minikube status
      register: minikube_status
      failed_when: false
      changed_when: false

    - name: Start Minikube
      ansible.builtin.command: >-
        minikube start --cpus={{ minikube_cpus }} --memory={{ minikube_memory }} --cni=calico
      register: minikube_start
      when: "'host: Running' not in minikube_status.stdout"
      changed_when: "'Done!' in minikube_start.stdout"

    - name: Detect the NetworkPolicy-capable CNI
      ansible.builtin.command: >-
        kubectl --context minikube -n kube-system get daemonset calico-node -o name
      register: calico_status
      changed_when: false
      failed_when: false
      retries: 15
      delay: 2
      until: calico_status.rc == 0

    - name: Reject an existing Minikube cluster without NetworkPolicy enforcement
      ansible.builtin.fail:
        msg: >-
          Kino requires the Calico CNI because its Redis and ticket-service
          NetworkPolicies are security boundaries. Recreate the local cluster
          with `minikube delete`, then rerun `task bootstrap-local-env`.
      when: calico_status.rc != 0

    - name: Wait for Calico NetworkPolicy enforcement
      ansible.builtin.command: >-
        kubectl --context minikube -n kube-system rollout status daemonset/calico-node --timeout=120s
      changed_when: false

    - name: Enable Ingress Addon
      ansible.builtin.command: minikube addons enable ingress
      register: ingress_enable
      changed_when: "'The \\'ingress\\' addon is enabled' not in ingress_enable.stdout"

    - name: Get Minikube IP
      ansible.builtin.command: minikube ip
      register: minikube_ip
      changed_when: false

    - name: Update /etc/hosts for local.kino.com
      become: true
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ minikube_ip.stdout }} local.kino.com"
        regexp: ".*local\\.kino\\.com"
        state: present

    - name: Update /etc/hosts for dev.kino.com
      become: true
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ minikube_ip.stdout }} dev.kino.com"
        regexp: ".*dev\\.kino\\.com"
        state: present
