version: '3'
dotenv: ['.env']

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  bootstrap-local-env:
    desc: Prepare local Minikube and host entries without provisioning app resources
    cmds:
      - ansible-playbook playbook.yaml -vv -K

  deploy:
    desc: Provision the infrastructure with Terraform
    cmds:
      - terraform init
      - terraform validate
      - terraform plan -out=.terraform/kino.plan
      - terraform apply -auto-approve .terraform/kino.plan

  deploy-with-vault:
    desc: Provision with Terraform, then bootstrap Vault-backed runtime secrets
    cmds:
      - task deploy
      - task setup-vault

  setup-vault:
    desc: Initialize/Unseal Vault and populate secrets
    cmds:
      - ./scripts/unseal_vault.sh

  cleanup-vault-bootstrap:
    desc: Remove local Vault bootstrap artifacts created outside Terraform
    cmds:
      - kubectl delete secret vault-eso-token -n default --ignore-not-found=true
      - kubectl delete -f k8s/vault-secrets.yaml --ignore-not-found=true

  destroy:
    desc: Destroy Terraform-managed infrastructure
    dir: .
    cmds:
      - terraform destroy -auto-approve

  urls:
    desc: Show access URLs for services
    cmds:
      - minikube service list

  verify-ticket-network-policy:
    desc: Assert the UI/BFF can reach the private ticket service while an ordinary pod cannot
    cmds:
      - |
        set -eu
        ticket_service="ticket-service"
        if [ "${TF_VAR_environment:-local}" = "dev" ]; then
          ticket_service="dev-ticket-service"
        fi
        kubectl --context minikube -n default get service "$ticket_service" >/dev/null
        kubectl --context minikube -n default rollout status "deployment/$ticket_service" --timeout=120s
        ui_service="ui"
        if [ "${TF_VAR_environment:-local}" = "dev" ]; then
          ui_service="dev-ui"
        fi
        ui_pod=$(kubectl --context minikube -n default get pods -l "app=$ui_service" \
          --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
        test -n "$ui_pod"
        kubectl --context minikube -n default exec "$ui_pod" -- \
          node -e "fetch('http://$ticket_service:8085/healthz').then((response) => { if (!response.ok) throw new Error('ticket service returned ' + response.status); }).catch((error) => { console.error(error); process.exit(1); })"
        kubectl --context minikube -n default run kino-ticket-network-policy-probe \
          --rm --restart=Never --pod-running-timeout=1m --image=busybox:1.36.1 --command -- \
          sh -c "if wget -q -T 3 -O- http://$ticket_service:8085/healthz; then echo 'unexpected ticket-service access' >&2; exit 1; fi"

  port-forward-postgres:
    desc: Forward local 127.0.0.1:15432 to the Minikube PostgreSQL service
    silent: true
    cmds:
      - |
        printf '%s\n' \
          'Starting a localhost-only PostgreSQL tunnel for pgAdmin or psql.' \
          '' \
          'pgAdmin connection:' \
          '  Host name/address: 127.0.0.1' \
          '  Port:              15432' \
          '  Maintenance DB:    kino_auth' \
          '  Username:          kino_auth_runtime' \
          '  Password:          TF_VAR_auth_database_runtime_password from .env' \
          '  Schema:            kino_auth' \
          '' \
          'Keep this terminal open while connected; press Ctrl+C to stop the tunnel.' \
          '' \
          'kubectl --context minikube -n postgres-system port-forward --address 127.0.0.1 service/postgres 15432:5432'
      - kubectl --context minikube -n postgres-system port-forward --address 127.0.0.1 service/postgres 15432:5432

  clean:
    desc: Full reset - delete Minikube cluster and Terraform state
    cmds:
      - task cleanup-vault-bootstrap || true
      - terraform destroy -auto-approve
      - minikube delete || true
      - rm -rf .terraform terraform.tfstate terraform.tfstate.backup
      - rm -f terraform.tfstate.*.backup cluster-keys.json terraform-debug.log deploy.log deploy_final_test.log deploy_lint_test.log
