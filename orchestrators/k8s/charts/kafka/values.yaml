image:
  repository: bitnamilegacy/kafka

service:
  type: NodePort

clusterId: J1mmUOT9JBz1rNWKu2uZZi

overrideConfiguration:
  auto.create.topics.enable: false

metrics:
  jmx:
    enabled: true
    image:
      repository: bitnamilegacy/jmx-exporter

sasl:
  client:
    users: ["root"]
    passwords: ""

defaultInitContainers:
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
  autoDiscovery:
    image:
      repository: bitnamilegacy/kubectl

provisioning:
  enabled: true
  waitForKafka: true
  useHelmHooks: true
  topics:
    - name: title-searches
      partitions: 1
      replicationFactor: 1
