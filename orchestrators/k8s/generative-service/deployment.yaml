apiVersion: v1
kind: Service
metadata:
  name: generative-service
spec:
  type: NodePort
  ports:
    - name: http
      port: 8083
      targetPort: 8000
      protocol: TCP
  selector:
    app: generative-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: generative-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: generative-service
  template:
    metadata:
      labels:
        app: generative-service
    spec:
      containers:
      - name: generative-service
        image: gryphon2411/kino-generative_service:latest
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key
              key: api-key
        - name: GENERATIVE_MODEL_PROVIDER
          value: google_genai
        - name: GENERATIVE_MODEL_NAME
          value: gemini-3.1-flash-lite
        - name: DATA_SERVICE_URL
          value: http://data-service:8082/api/v1/data

        - name: RABBITMQ_HOST_ADDRESS
          value: rabbitmq.rabbitmq-system
        - name: RABBITMQ_HOST_PORT
          value: "5672"
        - name: RABBITMQ_USERNAME
          value: kino-services
        - name: RABBITMQ_PASSWORD
          value: 2gGCIz8qgvuUzQfW
        - name: RABBITMQ_VHOST
          value: "/"
