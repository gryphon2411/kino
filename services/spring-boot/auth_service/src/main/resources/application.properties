server.port=${SERVICE_PORT}

spring.application.name=auth_service

logging.level.org.springframework.web=${SERVICE_LOGGING_LEVEL}
logging.level.org.springframework.security=${SERVICE_LOGGING_LEVEL}

kino.server.prefix-path=${SERVICE_PREFIX_PATH}
kino.security.form-login.redirect-url=${FORM_LOGIN_REDIRECT_URL}
kino.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://local.kino.com}

spring.data.mongodb.host=${MONGO_HOST_ADDRESS}
spring.data.mongodb.port=${MONGO_HOST_PORT}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.username=${MONGO_USERNAME}
spring.data.mongodb.password=${MONGO_PASSWORD}
# Fixes UncategorizedMongoDbException
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=true

spring.datasource.url=${AUTH_DATABASE_URL:jdbc:postgresql://localhost:5432/kino_auth?currentSchema=kino_auth}
spring.datasource.username=${AUTH_DATABASE_USERNAME:kino_auth_runtime}
spring.datasource.password=${AUTH_DATABASE_PASSWORD:replace-me-auth-runtime-password}

kino.cache.default.redis.host=${REDIS_HOST_ADDRESS}
kino.cache.default.redis.port=${REDIS_PORT}
kino.cache.default.redis.database=${REDIS_DATABASE}
kino.cache.default.redis.username=${REDIS_USERNAME}
kino.cache.default.redis.password=${REDIS_PASSWORD}
kino.cache.default.redis.namespace=${REDIS_NAMESPACE}

kino.cache.session.redis.host=${REDIS_HOST_ADDRESS}
kino.cache.session.redis.port=${REDIS_PORT}
kino.cache.session.redis.username=${REDIS_USERNAME}
kino.cache.session.redis.password=${REDIS_PASSWORD}

spring.kafka.producer.bootstrap-servers=${KAFKA_HOSTS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.properties.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

kino.machine-auth.token-ttl=${MACHINE_ACCESS_TOKEN_TTL:PT5M}
kino.machine-auth.issuer=${AUTH_SERVER_ISSUER_URI:http://localhost:8081}
kino.machine-auth.signing-key.private-key-path=${AUTH_SERVICE_JWT_PRIVATE_KEY_PATH:}
kino.machine-auth.signing-key.public-key-path=${AUTH_SERVICE_JWT_PUBLIC_KEY_PATH:}
kino.machine-auth.agent.client-id=${AGENT_SERVICE_CLIENT_ID:agent-service}
kino.machine-auth.agent.client-secret=${AGENT_SERVICE_CLIENT_SECRET:replace-me-agent-secret}
kino.machine-auth.agent.scopes=${AGENT_SERVICE_CLIENT_SCOPES:kino.agent.curator.read}
kino.machine-auth.agent.audience=${AGENT_SERVICE_CLIENT_AUDIENCE:kino-data-internal}
kino.machine-auth.web-bff.client-id=${WEB_BFF_CLIENT_ID:kino-web-bff}
kino.machine-auth.web-bff.client-secret=${WEB_BFF_CLIENT_SECRET:replace-me-web-bff-secret}
kino.machine-auth.web-bff.redirect-uri=${WEB_BFF_REDIRECT_URI:http://local.kino.com/api/auth/callback}
kino.machine-auth.web-bff.scopes=${WEB_BFF_CLIENT_SCOPES:openid,profile,kino.data.read}
kino.machine-auth.web-bff.audience=${WEB_BFF_CLIENT_AUDIENCE:kino-data-api}
kino.machine-auth.web-bff.access-token-ttl=${WEB_BFF_ACCESS_TOKEN_TTL:PT5M}
kino.machine-auth.web-bff.refresh-token-ttl=${WEB_BFF_REFRESH_TOKEN_TTL:PT8H}

# Kubernetes calls the shallow lifecycle/readiness groups directly on the pod;
# they are not exposed through the public ingress routes.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,mongo,redis
