name: kino terraform validation

on:
  push:
    branches: [master]
    paths:
      - orchestrators/k8s/terraform/**
      - .github/workflows/kino-terraform.yaml
  pull_request:
    branches: [master]
    paths:
      - orchestrators/k8s/terraform/**
      - .github/workflows/kino-terraform.yaml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrators/k8s/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers without state backend
        run: terraform init -backend=false

      - name: Validate configuration
        run: terraform validate
