name: kino viewing plan service ci

on:
  push:
    branches: [master]
    paths:
      - services/express/viewing_plan_service/**
      - orchestrators/k8s/terraform/viewing-plan-db-migrations/**
      - .github/workflows/kino-viewing-plan-service.yaml
      - .github/scripts/**
  pull_request:
    branches: [master]
    paths:
      - services/express/viewing_plan_service/**
      - orchestrators/k8s/terraform/viewing-plan-db-migrations/**
      - .github/workflows/kino-viewing-plan-service.yaml
      - .github/scripts/**
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the image from the selected ref.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kino-viewing_plan_service
  PUBLISH_REF: refs/heads/master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/express/viewing_plan_service/package-lock.json
      - name: Install and test
        working-directory: services/express/viewing_plan_service
        run: |
          npm ci
          npm run test
          npm run test:integration
      - name: Decide publish mode
        id: publish_decision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/resolve_image_publish.py \
            --canonical-ref "${{ env.PUBLISH_REF }}" \
            --canonical-tag latest
      - name: Log in to Docker Hub
        if: steps.publish_decision.outputs.should_publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build image for CI validation
        if: steps.publish_decision.outputs.should_publish != 'true'
        uses: docker/build-push-action@v7
        with:
          context: services/express/viewing_plan_service
          file: services/express/viewing_plan_service/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
      - name: Build and push
        if: steps.publish_decision.outputs.should_publish == 'true'
        id: publish_image
        uses: docker/build-push-action@v7
        with:
          context: services/express/viewing_plan_service
          file: services/express/viewing_plan_service/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.publish_decision.outputs.resolved_tag }}
      - name: Write release manifest
        if: steps.publish_decision.outputs.should_publish == 'true'
        run: |
          python3 .github/scripts/write_image_release_manifest.py \
            --service viewing-plan-service \
            --terraform-var TF_VAR_viewing_plan_service_image_ref \
            --repository "${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}" \
            --tag "${{ steps.publish_decision.outputs.resolved_tag }}" \
            --digest "${{ steps.publish_image.outputs.digest }}" \
            --git-revision "${{ github.sha }}" \
            --git-ref "${{ github.ref }}" \
            --git-commit-subject "$(git log -1 --pretty=%s)" \
            --workflow "${{ github.workflow }}" \
            --output release-manifest.json
      - name: Upload release manifest
        if: steps.publish_decision.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: viewing-plan-service-release-manifest
          path: release-manifest.json
